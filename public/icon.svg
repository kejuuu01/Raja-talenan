<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <!-- Warm Orange & Cream Pixel Backdrop -->
  <rect width="512" height="512" rx="96" fill="#FF6B35" />
  <rect x="24" y="24" width="464" height="464" rx="76" fill="#FFF7E8" stroke="#3B2314" stroke-width="16" />

  <!-- Golden Crown -->
  <rect x="192" y="56" width="128" height="24" fill="#FACC15" stroke="#3B2314" stroke-width="12" />
  <rect x="192" y="34" width="28" height="26" fill="#FACC15" stroke="#3B2314" stroke-width="10" />
  <rect x="242" y="24" width="28" height="36" fill="#FEF08A" stroke="#3B2314" stroke-width="10" />
  <rect x="292" y="34" width="28" height="26" fill="#FACC15" stroke="#3B2314" stroke-width="10" />

  <!-- Oak Cutting Board -->
  <rect x="76" y="214" width="360" height="206" rx="22" fill="#8F5729" />
  <rect x="76" y="196" width="360" height="206" rx="22" fill="#E6B17A" stroke="#3B2314" stroke-width="16" />
  <rect x="100" y="220" width="312" height="158" rx="10" fill="#F2C894" />
  <!-- Board Handle Slot -->
  <rect x="214" y="346" width="84" height="20" rx="6" fill="#3B2314" />
  <!-- Sliced Carrot & Cucumber on Board -->
  <rect x="132" y="294" width="76" height="36" rx="8" fill="#FB923C" stroke="#3B2314" stroke-width="10" />
  <rect x="216" y="294" width="30" height="36" rx="6" fill="#FDBA74" stroke="#3B2314" stroke-width="10" />
  <rect x="302" y="286" width="64" height="44" rx="10" fill="#22C55E" stroke="#3B2314" stroke-width="10" />
  <rect x="316" y="298" width="36" height="20" fill="#86EFAC" />

  <!-- Pixel Chef Cleaver diagonally slicing -->
  <g transform="translate(256 175) rotate(-18)">
    <!-- Blade -->
    <rect x="-112" y="-52" width="144" height="68" fill="#DCE4EC" stroke="#3B2314" stroke-width="14" />
    <rect x="-102" y="0" width="124" height="12" fill="#FFFFFF" />
    <rect x="-102" y="-42" width="124" height="10" fill="#94A3B8" />
    <rect x="-88" y="-34" width="14" height="14" fill="#3B2314" />
    <!-- Tang & Wooden Handle -->
    <rect x="32" y="-36" width="88" height="32" fill="#B45309" stroke="#3B2314" stroke-width="14" />
    <rect x="52" y="-26" width="12" height="12" fill="#FACC15" />
    <rect x="82" y="-26" width="12" height="12" fill="#FACC15" />
  </g>

  <!-- Pixel Sparkles -->
  <rect x="104" y="100" width="24" height="8" fill="#FACC15" />
  <rect x="112" y="92" width="8" height="24" fill="#FACC15" />
  <rect x="386" y="94" width="24" height="8" fill="#FACC15" />
  <rect x="394" y="86" width="8" height="24" fill="#FACC15" />
</svg>
